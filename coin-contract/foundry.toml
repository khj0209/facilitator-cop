[profile.default]
src = "contracts"
out = "artifacts/foundry"
cache_path = "cache/foundry"
script = "scripts"
optimizer_runs = 10000000
libs = [
    "lib",
    "node_modules",
]
remappings = [
    "forge-std/=lib/forge-std/src",
    "@openzeppelin/=node_modules/@openzeppelin/",
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
giwa_sepolia = "${GIWA_SEPOLIA_RPC_URL}"
